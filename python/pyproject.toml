[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "horizon"
version = "0.1.0a0"
description = "A Rust Bayesian inference framework implementing message passing on factor graphs and MCMC."
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
features = ["pyo3/extension-module"]
